name: Test custom output file path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create output directory
        run: mkdir -p "$GITHUB_WORKSPACE/custom-output"

      - id: action
        uses: .
        continue-on-error: true
        with:
          format: sarif
          output: custom-output/scan-results.sarif

      - name: Assert custom output file exists at specified path
        run: |
          echo "Checking for custom-output/scan-results.sarif..."
          if [ ! -f "$GITHUB_WORKSPACE/custom-output/scan-results.sarif" ]; then
            echo "FAIL: custom-output/scan-results.sarif not found"
            exit 1
          fi
          echo "PASS: custom output file exists at custom-output/scan-results.sarif"

      - name: Assert custom output file is non-empty
        run: |
          SIZE=$(wc -c < "$GITHUB_WORKSPACE/custom-output/scan-results.sarif")
          echo "File size: $SIZE bytes"
          if [ "$SIZE" -eq 0 ]; then
            echo "FAIL: output file is empty"
            exit 1
          fi
          echo "PASS: output file is non-empty ($SIZE bytes)"
